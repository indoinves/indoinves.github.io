<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Indoinves</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="https://indoinves.github.io/img/indoinves.png">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <!-- Sidebar Admin -->
    <aside id="sidebar" class="bg-slate-900 w-64 border-r border-slate-800 flex flex-col transition-all duration-300 absolute md:relative z-20 h-full -translate-x-full md:translate-x-0">
        <div class="p-4 flex items-center space-x-3 border-b border-slate-800">
            <img src="https://indoinves.github.io/img/indoinves.png" alt="Logo" class="w-8 h-8 object-contain">
            <span class="font-bold text-lg text-emerald-400">Admin Panel</span>
        </div>
        <nav class="flex-1 p-4 space-y-2 text-sm">
            <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-emerald-500/10 text-emerald-400 font-medium">📋 <span>Validasi Transaksi</span></a>
            <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">👥 <span>Kelola Member</span></a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 font-medium py-2 rounded-lg text-sm transition">Keluar</button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
            <button onclick="toggleSidebar()" class="md:hidden text-slate-300 focus:outline-none">☰ Menu</button>
            <h2 class="text-lg font-semibold text-emerald-400">Pusat Kendali Administrator</h2>
            <div class="text-sm text-slate-300" id="adminEmail">Loading...</div>
        </header>

        <main class="p-6 space-y-6">
            <div class="bg-slate-900 rounded-xl border border-slate-800 p-5">
                <h3 class="text-base font-semibold mb-4 text-emerald-400">Antrean Deposit / Transaksi Pending</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-800 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">User ID</th>
                                <th class="p-3">Tipe</th>
                                <th class="p-3">Jumlah</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="trxTableBody" class="divide-y divide-slate-800">
                            <!-- Data dimuat secara real-time -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://tdiubbgueasfhmcmmahq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_73oZ-U6TFidIXEP5uYSpkw_v0OSvs8S';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAdminSession() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('adminEmail').innerText = user.email;

            // Verifikasi role admin
            const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', user.id).single();
            if (!profile || profile.role !== 'admin') {
                alert('Akses ditolak! Anda bukan administrator.');
                window.location.href = 'index.html';
            }
        }

        async function loadTransactions() {
            const { data, error } = await supabaseClient.from('transactions').select('*').eq('status', 'Pending');
            const tbody = document.getElementById('trxTableBody');
            tbody.innerHTML = '';

            if (data && data.length > 0) {
                data.forEach(trx => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="p-3 text-xs font-mono text-slate-400">${trx.user_id}</td>
                            <td class="p-3">${trx.type}</td>
                            <td class="p-3 font-semibold text-emerald-400">Rp ${Number(trx.amount).toLocaleString('id-ID')}</td>
                            <td class="p-3"><span class="bg-amber-500/10 text-amber-400 px-2 py-1 rounded text-xs">${trx.status}</span></td>
                            <td class="p-3">
                                <button onclick="approveTrx('${trx.id}', '${trx.user_id}', ${trx.amount})" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1 rounded text-xs font-bold transition">Setujui</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Tidak ada transaksi pending saat ini.</td></tr>`;
            }
        }

        async function approveTrx(trxId, userId, amount) {
            // Update transaksi jadi Success
            const { error: errTrx } = await supabaseClient.from('transactions').update({ status: 'Success' }).eq('id', trxId);
            if (errTrx) { alert('Gagal memperbarui transaksi: ' + errTrx.message); return; }

            // Ambil saldo member saat ini
            const { data: profile } = await supabaseClient.from('profiles').select('saldo').eq('id', userId).single();
            const currentSaldo = profile ? Number(profile.saldo) || 0 : 0;
            const newSaldo = currentSaldo + amount;

            // Tambahkan saldo ke profil member secara real-time
            const { error: errProfile } = await supabaseClient.from('profiles').update({ saldo: newSaldo }).eq('id', userId);
            if (errProfile) { alert('Gagal memperbarui saldo member: ' + errProfile.message); return; }

            alert('Transaksi berhasil disetujui dan saldo member telah bertambah!');
            loadTransactions();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        checkAdminSession();
        loadTransactions();
    </script>
</body>
</html>
