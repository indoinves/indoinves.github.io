name: Auto Generate and Commit Pages

on:
  push:
    branches: [ main, master ]

# Memberikan izin write agar bot bisa commit & push folder otomatis ke repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Generator Script
        run: python generator.py

      - name: Commit and Push Generated Folders
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "[skip ci] chore: auto-generate folders and html files via actions" && git push)
